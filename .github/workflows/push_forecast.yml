name: Push Forecast to Google Sheets

on:
  schedule:
    # Both crons fire daily; the DST guard step (below) skips the run
    # that doesn't land on 5 AM Central, so no manual swap is needed.
    - cron: '17 10 * * *'  # 5:17 AM CT during CDT (UTC-5, Mar–Nov)
    - cron: '17 11 * * *'  # 5:17 AM CT during CST (UTC-6, Nov–Mar)
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  push-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: DST guard — skip if not 5 AM Central
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          if [ "$HOUR" != "05" ]; then
            echo "Current Central hour is $HOUR, not 05. Skipping this DST duplicate."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run push_to_sheets.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python push_to_sheets.py