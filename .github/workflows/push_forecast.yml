name: Push Forecast to Google Sheets

on:
  schedule:
    # Scheduled to fire 17 min after Looker's 6:00 AM CT webhook (Supabase
    # Edge Function ingests + runs generate_forecast() in ~45 sec). Pins run to
    # 6:17 AM Central. DST note: GitHub Actions cron is UTC and does NOT adjust
    # for DST. Current value is correct during CDT (UTC-5). When the US returns
    # to CST in November (UTC-6), change to '17 12 * * *' to stay at 6:17 AM CT.
    #
    # Known delay caveat: GitHub-hosted scheduled runs are regularly delivered
    # 3-5 hours late during US-morning peak (11:00-14:00 UTC). The Sheet update
    # therefore typically lands ~10 AM CT in practice, not 6:17 AM CT. This is
    # acceptable because push_to_sheets.py runs post-Looker either way; the
    # cron time here is documented intent, not a delivery guarantee. Fixing the
    # delay requires an event-driven trigger (Supabase Edge Function ->
    # workflow_dispatch) which is blocked on Supabase org admin permissions.
    - cron: '17 11 * * *'  # 6:17 AM Central (11:17 UTC) during CDT
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  push-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run push_to_sheets.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python push_to_sheets.py