name: Push Forecast to Google Sheets

on:
  schedule:
    # Scheduled to fire ~47 min after Looker's 4:30 AM CT webhook (Supabase
    # Edge Function ingests + runs generate_forecast() in ~45 sec). Pins run to
    # 5:17 AM Central. DST note: GitHub Actions cron is UTC and does NOT adjust
    # for DST. Current value is correct during CDT (UTC-5). When the US returns
    # to CST in November (UTC-6), change to '17 11 * * *' to stay at 5:17 AM CT.
    - cron: '17 10 * * *'  # 5:17 AM Central (10:17 UTC) during CDT
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  push-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run push_to_sheets.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python push_to_sheets.py